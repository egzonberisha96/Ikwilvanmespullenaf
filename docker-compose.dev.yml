version: "3.9"

# Gebruik dit tijdens lokale ontwikkeling met `npm run dev`:
#   docker compose -f docker-compose.dev.yml up -d
# en start daarna de Next.js dev server los met `npm run dev`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ikwilvanmespullenaf
      POSTGRES_PASSWORD: ikwilvanmespullenaf
      POSTGRES_DB: ikwilvanmespullenaf
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
