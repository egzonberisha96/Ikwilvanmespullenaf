version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ikwilvanmespullenaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikwilvanmespullenaf}
      POSTGRES_DB: ${POSTGRES_DB:-ikwilvanmespullenaf}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikwilvanmespullenaf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ikwilvanmespullenaf}:${POSTGRES_PASSWORD:-ikwilvanmespullenaf}@postgres:5432/${POSTGRES_DB:-ikwilvanmespullenaf}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
